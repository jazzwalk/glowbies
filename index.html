<style>
/* Layout: one phone screen — status strip, floor plan of the flat (tap rooms to walk), story log, action list; modals for scenes */
:root{
  --wall:#1d1a2b; --plan:#2a2540; --line:#4a4266; --ink:#f3eefa; --muted:#a79fbe;

}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.app{max-width:540px;margin:0 auto;box-sizing:border-box;padding-inline:12px;padding-block:8px;display:flex;flex-direction:column;gap:8px;height:100%}
.top{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;flex:none}
.clock{font-family:var(--display);font-weight:700;font-size:1.45rem;font-variant-numeric:tabular-nums;color:var(--lamp);line-height:1}
.clock small{display:block;font-family:var(--body);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:3px}
.sus{display:flex;flex-direction:column;gap:4px;min-width:0}
.sus span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.bar{height:10px;border-radius:5px;background:var(--plan);overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--lamp),var(--alarm));transition:width .4s}
.bag{text-align:right;font-size:.8rem;color:var(--muted);font-weight:700;line-height:1.3}
.bag b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--glow);font-weight:700}

.plan{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;flex:1 1 auto;min-height:190px;gap:5px;background:var(--line);border:5px solid var(--line);border-radius:12px}
.room{position:relative;border:0;padding:8px;text-align:left;font-family:var(--body);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:pointer;min-width:0}

.room[data-r="flur"]{background:var(--carpet)}
.room[data-r="arbeit"]{background:repeating-linear-gradient(45deg,#262a3a 0 8px,#22263a 8px 16px)}
.room .nm{font-size:.52rem;letter-spacing:.05em;max-width:calc(100% - 44px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere;text-transform:uppercase;font-weight:800;color:var(--muted);background:color-mix(in srgb,var(--wall) 70%,transparent);padding:2px 5px;border-radius:4px;align-self:flex-start}
.room .who{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:30px}
.tok{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.95rem}
.tok.l{background:var(--lamp);color:var(--wall);box-shadow:0 0 0 3px color-mix(in srgb,var(--lamp) 35%,transparent)}
.tok.m{background:var(--m);color:var(--wall)}
.pkg{width:20px;height:16px;background:#c79a5c;border-radius:3px;box-shadow:inset 0 -3px 0 #9c7440;position:relative}
.pkg::after{content:"";position:absolute;left:8px;top:0;width:4px;height:100%;background:#e8d3a6}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.room.here{box-shadow:inset 0 0 0 3px var(--lamp)}
.room.near{cursor:pointer}
.room.near::after{content:"→";position:absolute;right:7px;top:5px;color:var(--lamp);font-weight:800}
.room.far{filter:brightness(.72);cursor:default}
.room.closed .nm::after{content:" · zu";color:var(--m)}

.log{flex:1 1 auto;background:var(--plan);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:4.1em;overflow:hidden;line-height:1.3;font-size:.82rem}

.spot .n{grid-area:n;font-size:.76rem;font-weight:800;line-height:1.2;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;align-self:center}

.spot .c{grid-area:c;display:flex;align-items:center;gap:3px;border-radius:999px;padding:4px 9px 4px 7px;font-family:var(--display);font-weight:700;font-size:.85rem;background:var(--lamp);color:var(--wall);white-space:nowrap}

.btn{font-family:var(--body);font-weight:800;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn.sq{width:32px;height:32px;padding:0;font-size:1.1rem;font-family:var(--display)}
.btn.go{background:var(--lamp);color:var(--wall);border-color:var(--lamp)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;min-height:32px}

.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:16px;background:color-mix(in srgb,var(--wall) 80%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:10}
.sheet{max-width:420px;width:100%;max-height:88%;overflow-y:auto;background:var(--plan);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}

.choice{display:flex;flex-direction:column;gap:8px}
.choice .btn{text-align:left;border-radius:12px;padding:10px 14px;font-weight:700}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}

.room>*{position:relative;z-index:1}

.gbm{filter:drop-shadow(0 0 2.5px #b8f27c)}
.room .who{justify-content:flex-end;min-height:0;position:absolute;right:5px;top:5px}
.tok{width:28px;height:28px;border-radius:50%;overflow:hidden;display:block;transition:transform .3s}

.room .furn{height:84%!important}
.ctl{display:flex;gap:4px}
.ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--plan);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;font-family:var(--display);font-weight:700;font-size:.78rem}
.ic svg{width:14px;height:14px}
.ic[aria-pressed="true"]{background:var(--lamp);color:var(--wall);border-color:var(--lamp)}
.ic:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.tick{height:3px;border-radius:2px;background:var(--plan);overflow:hidden;margin-top:4px}
.tick div{height:100%;background:var(--lamp);transform-origin:left;transform:scaleX(0)}
.sus .mstat{color:var(--m);text-transform:none;letter-spacing:0;font-size:.74rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

body{margin:0}
.room.mroom{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--m) 70%,transparent)}

.planwrap{position:relative;flex:0 1 auto;min-height:190px;display:flex}

<script>

function npcRoomM(){ return S.M.ex ? S.M.room : 'wohn'; }
function npcAsleep(){ return !!(S.M.ex && ((S.M.ex.kind==='wake' && S.M.step===0) || (S.M.ex.kind==='bed' && S.M.step>=1))); }
function buildScheduleM(d){
  const r=(a,b)=>Math.round((a+Math.random()*(b-a))/10)*10, D=DAYS_M[d], ex=[];
  [[620,650],[930,960],[1030,1060]].forEach(w=>ex.push({start:r(...w),kind:'pause',steps:[[Math.random()<.5?'kueche':'bad',2,'pause'],['flur',1]]}));
  ex.push({start:700,kind:'cook',steps:[['kueche',2,'cook'],['kueche',3,'lunch']]});
  if(D.city) ex.push({start:900,kind:'city',steps:[['flur',1,'cityleave'],['weg',12,'city'],['flur',1,'cityhome']]});
  if(D.outlet) ex.push({start:880,kind:'outlet',steps:[['flur',1,'outletask'],['weg',10,'shop'],['flur',1,'shophome']]});
  if(D.match) ex.push({start:1110,kind:'match',steps:[['wohn',11,'match']]});
  if(D.dinner) ex.push({start:1110,kind:'dinner',steps:[['flur',1,'dinnerask'],['weg',12,'eat'],['flur',1,'eathome']]});
  ex.sort((a,b)=>a.start-b.start);
  let end=0; for(const e of ex){ if(e.start<end) e.start=end+10; end=e.start+e.steps.reduce((s,x)=>s+x[1],0)*TURN; }
  return ex;
}

  render();
}

function npcTickM(){
  const M=S.M;
  if(M.ex){
    M.left--;
    if(M.left<=0){
      M.step++;
      if(M.step>=M.ex.steps.length){ if(M.ex.kind==='match'){ S.matchOn=false; S.watching=false; say('Abpfiff. L steht auf: „War’s gut?“','cue'); } M.ex=null; M.room='wohn'; M.seen=false; return; }
      const st=M.ex.steps[M.step]; lEnter(st[0],st[1],st[2]);
    }
    return;
  }
  const e=S.sched.find(x=>x.start<=S.t && !x.used);
  if(e){ e.used=true; M.ex=e; M.step=0; M.seen=false; const st=e.steps[0]; lEnter(st[0],st[1],st[2]); return; }
  const soon=S.sched.find(x=>x.start===S.t+2*TURN && !x.used);
  if(soon && CUES_M[soon.kind]) say(pick(CUES_M[soon.kind]),'cue');
}

  if(S.beer){ const bonus=(S.gaming||(S.watching&&S.matchOn))?2:1; S.fun+=bonus; S.beerGot=(S.beerGot||0)+bonus; S.beerSips=(S.beerSips??3)-1;
    if(S.beerSips<=0){ S.beer=0; say(`Bier leer. +${S.beerGot} Freizeitpunkte. ${(S.gaming||S.watching)?'Zum Zocken schmeckt’s doppelt.':'Noch eins?'}`,'good'); S.beerGot=0; } }
  if(S.practice){ if(S.room!==S.practice){ S.practice=null; } else { S.fun+=2;
      if(Math.random()<.2){ const r=S.room; S.broken=S.broken||{}; const hadDeco=(r==='wohn')||((S.deco||1)>=2&&r==='flur');

        else { bubble('M','Fore!'); say(pick(['Der Ball trifft die Wanduhr. Sie geht jetzt fünf Minuten vor.','Der Ball rollt unters Sofa. Hummi bewacht ihn.','Rüdiger saugt den Golfball ein. Er hustet.']),'cue'); } } } }

  else if(!S.M.ex && !S.matchOn && S.t>=570 && S.t<1200 && (S.busyN||0)<2 && Math.random()<.06){ S.busyN=(S.busyN||0)+1; const k=Math.random()<.5?'freundin':'tratsch'; S.lBusy={kind:k,left:5+(Math.random()*3|0)};
    say(k==='freundin' ? 'L schaut ein Decluttering-Video auf YouTube: „Behalte nur, was Freude bringt.“ Fünf Minuten später telefoniert sie stattdessen mit ihrer Freundin. L ist abgelenkt!' : 'L hat einen Tratsch-Termin mit Kollege S. Kamera aus, Kaffee an, Ohren auf. L ist abgelenkt!','good'); bubble('L', k==='freundin'?'Hiii! Du glaubst nicht…':'S! Erzähl alles!'); }

  if(S.M.ex) S.lTV=null;

function meetCheckM(){
  const nr=npcRoomM();

  if(S.practice && S.room===nr && !S.lBusy){ S.practice=null; S.M.seen=true; addSusp(8); bubble('L','Nicht in der Wohnung!!',3200); say('L kommt rein, als M gerade ausholt. „Nicht. In. Der. Wohnung.“','bad'); return; }
  if(S.broken && S.broken[nr] && !(S.brokenSeen||{})[nr]){ S.brokenSeen={...(S.brokenSeen||{}),[nr]:true}; return superGau(nr); }
  if(S.fixedOdd && S.fixedOdd[nr]){ delete S.fixedOdd[nr]; addSusp(8); bubble('L','Warum hängt der Hummer kopfüber?',3200); say('L bleibt stehen. Ein Hummer der Lichterkette hängt kopfüber. Sie schaut M an. M schaut weg.','bad'); }
  if(S.lBusy) return;
  if(S.M.seen) return; S.M.seen=true;
  if(S.gaming && !S.matchOn) return caughtGaming();
  if(S.aperolM){ addSusp(-6); bubble('L','Endlich trinkst du was Vernünftiges!'); say('L sieht M mit einem Aperol. Sie ist gerührt.','good'); return; }
  if(S.beer){ addSusp(6); bubble('L',pick(['Schon wieder Bier?','Und mein Aperol?'])); say('L schaut auf Ms Bier. „Und mein Aperol?“','bad'); return; }
  say(pick(MEET_L)); bubble('L',pick(['Na?','Hey du.','Huhu.']));
}

    const opts=EXCUSES_M.filter(e=>!(e.daily&&(S.dailyEx||[]).includes(e.daily))); const three=[];
    while(three.length<3&&opts.length) three.push(opts.splice(Math.random()*opts.length|0,1)[0]);

      three.map(e=>({label:e.t,fn:()=>{ if(e.daily) S.dailyEx=[...(S.dailyEx||[]),e.daily]; const win=Math.random()<e.p; addSusp(win?4:20); if(!win) S.psLock=3;

  });
}

let DBX=null, USR=null, MYID=null, CANW=null;
(async()=>{ try{ if(!window.claude||!window.claude.use) return; DBX=await window.claude.use('db'); USR=await window.claude.use('user'); if(USR){ MYID=await USR.id(); CANW=await USR.can('data.write'); } await achSync(); }catch(e){} })();
async function achSync(){ if(!DBX||!MYID) return; try{ const ref=DBX.collection('ach').doc(MYID); const snap=await ref.get(); const remote=(snap.exists&&Array.isArray((snap.data()||{}).ids))?snap.data().ids:[]; const all=[...new Set([...ACH_GOT,...remote])]; ACH_GOT.splice(0,ACH_GOT.length,...all); try{ localStorage.setItem('glowbies-ach',JSON.stringify(ACH_GOT)); }catch(e){} if(CANW!==false && all.length!==remote.length) await ref.set({ids:all,at:Date.now()}); }catch(e){} }
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function localBest(){ try{ return JSON.parse(localStorage.getItem('glowbies-best')||'{}'); }catch(e){ return {}; } }
function lastNick(){ try{ return localStorage.getItem('glowbies-nick')||''; }catch(e){ return ''; } }
async function submitScore(mode,score,title,nick){
  nick=(nick||'').trim().slice(0,20)||(mode==='L'?'L':'M');
  try{ const all=localBest(); (all[mode]=all[mode]||[]).push({nick,score,title,at:Date.now()}); all[mode].sort((a,b)=>b.score-a.score); all[mode]=all[mode].slice(0,10); localStorage.setItem('glowbies-best',JSON.stringify(all)); localStorage.setItem('glowbies-nick',nick); }catch(e){}
  if(!DBX||!MYID) return 'device'; if(CANW===false) return 'local';
  try{
    const ref=DBX.collection('scores').doc(MYID); const snap=await ref.get(); const cur=snap.exists?{...snap.data()}:{};
    const k='best'+mode;
    if(!cur[k] || score>cur[k]){ cur[k]=score; cur['title'+mode]=title; cur['at'+mode]=Date.now(); }
    cur.nick=nick; await ref.set(cur); return 'shared';
  }catch(e){ CANW=false; return 'local'; }
}
function cleanNick(n){ return (n||'').normalize('NFKD').replace(/[^A-Za-z0-9ÄÖÜäöüß]/g,'').slice(0,16)||'Anonym'; }
function chk(mode,score,nick){ let h=7; const t=`${mode}|${score}|${nick}|hummi-glowbies`; for(const c of t) h=(h*31+c.charCodeAt(0))>>>0; return h.toString(36).toUpperCase().slice(-3).padStart(3,'0'); }
function makeCode(mode,score,nick){ nick=cleanNick(nick); return `${mode}-${score}-${nick}-${chk(mode,score,nick)}`; }
function parseCode(code){ const m=(code||'').trim().match(/^([LM])-(\d{1,4})-([A-Za-z0-9ÄÖÜäöüß]{1,16})-([0-9A-Z]{3})$/i); if(!m) return null; const mode=m[1].toUpperCase(), score=+m[2], nick=m[3]; return chk(mode,score,nick)===m[4].toUpperCase() ? {mode,score,nick} : null; }
async function addByCode(code){
  const c=parseCode(code); if(!c) return 'Der Code stimmt nicht. Bitte genau so eingeben, wie er geschickt wurde.';
  if(!DBX) return 'Die gemeinsame Liste ist hier gerade nicht erreichbar.';
  try{ const ref=DBX.collection('scores').doc('c_'+c.nick.toLowerCase()); const snap=await ref.get(); const cur=snap.exists?{...snap.data()}:{};
    const k='best'+c.mode; if(cur[k] && cur[k]>=c.score) return `${c.nick} hat schon ${cur[k]} Punkte als ${c.mode}. Nichts geändert.`;
    cur[k]=c.score; cur['title'+c.mode]='per Code eingereicht'; cur['at'+c.mode]=Date.now(); cur.nick=c.nick; await ref.set(cur);
    return `Eingetragen: ${c.nick} mit ${c.score} Punkten als ${c.mode}.`; }catch(e){ return 'Eintragen hat nicht geklappt. Bitte gleich nochmal versuchen.'; }
}
async function boardHTML(){
  const rows={L:[],M:[]}; let shared=false;
  if(DBX){ try{ for(const m of ['L','M']){ const q=await DBX.collection('scores').orderBy('best'+m,'desc').limit(10).get(); q.docs.forEach(d=>{ const x=d.data()||{}; if(typeof x['best'+m]==='number') rows[m].push({nick:x.nick||'?',score:x['best'+m],title:x['title'+m]||'',me:d.id===MYID}); }); } shared=true; }catch(e){ shared=false; rows.L=[]; rows.M=[]; } }
  if(!shared){ const lb=localBest(); ['L','M'].forEach(m=>rows[m]=(lb[m]||[]).map(x=>({...x,me:false}))); }
  const tbl=(m,label)=>`<h4 style="margin:6px 0 2px;font-family:var(--display)">${label}</h4>`+(rows[m].length?`<div class="stat">${rows[m].map((r,i)=>`<span>${i+1}. ${esc(r.nick)}${r.me?' (du)':''}<br><small style="color:var(--muted)">${esc(r.title)}</small></span><span>${r.score}</span>`).join('')}</div>`:'<p style="color:var(--muted)">Noch keine Einträge.</p>');
  return `<h3>Bestenliste</h3><p style="color:var(--muted);font-size:.85rem">${shared?'Gemeinsame Bestenliste aller Spieler.':'Nur auf diesem Gerät gespeichert.'}</p>`+tbl('L','L · Glowbies schmuggeln')+tbl('M','M · Zocken, Bier & Arminia');
}
async function showBoard(back,msg){
  sheet('<h3>Bestenliste</h3><p>Lädt…</p>',[]);
  let owner=false; try{ owner=!!(USR && await USR.isOwner()); }catch(e){}
  const form = owner&&DBX ? `<div class="say"><label for="codein" style="font-size:.85rem;color:var(--muted)">Score-Code von Freunden eintragen</label><input id="codein" placeholder="z. B. M-147-Anna-7QK" style="-webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box;margin-top:4px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--wall);color:var(--ink);font:inherit">${msg?`<p style="margin:6px 0 0;font-size:.85rem">${esc(msg)}</p>`:''}</div>` : '';
  const btns=[{label:'Zurück',go:true,fn:back}];
  if(form) btns.unshift({label:'Code eintragen',fn:async()=>{ const r=await addByCode($('codein').value); showBoard(back,r); }});
  sheet(await boardHTML()+form, btns);
}

function buildSchedule(d){
  const r=(a,b)=>Math.round((a+Math.random()*(b-a))/10)*10;
  const flags = DAYS[d].flags;
  const ex = [];
  [[560,620],[650,690],[880,950],[1010,1070]].forEach(w=>ex.push({start:r(...w),kind:'coffee',steps:[['flur',1],['kueche',1,'coffee'],['flur',1]]}));
  [[800,860],[1100,1130]].forEach(w=>ex.push({start:r(...w),kind:'bath',steps:[['flur',1],['bad',1,'bath'],['flur',1]]}));
  ex.push({start:720,kind:'lunch',steps:[['flur',1],['kueche',2,'cook lunch'],['wohn',3,flags.water?'sofa water':'sofa'],['flur',1]]});
  if(flags.swing) ex.push({start:1080,kind:'swing',steps:[['flur',2,'swing golf'],['wohn',2,'sofa'],['flur',1]]});
  if(DAYS[d].evening) ex.push({start:1140,kind:'evening',why:DAYS[d].evening,steps:[['flur',1,'evening'],['weg',12,'eve'],['flur',1,'evehome']]});
  else ex.push({start:1140,kind:'dinner',steps:[['flur',1],['kueche',2,flags.oven?'oven':'cook'],['wohn',3,'sofa evening'],['flur',1]]});
  (DAYS[d].outs||[]).forEach(([w,dur,why])=>{
    const e={start:r(...w),kind:'out',why};
    if(Math.random()<.55){
      const k=1+(Math.random()*2|0), f=pick(FORGOT); e.forgot=f;
      e.steps=[['flur',1,'leave'],['weg',k,'out'],['flur',1,'forgot'],[f[1],1,'fetch'],['flur',1],['weg',Math.max(1,dur-k),'out2'],['flur',1,'home']];
    } else e.steps=[['flur',1,'leave'],['weg',dur,'out'],['flur',1,'home']];
    if(why==='range') e.steps.push(['flur',2,'putt']);
    ex.push(e);
  });
  ex.push({start:1290,kind:'bed',steps:[['flur',1],['bad',1,'bath'],['schlaf',30,'bed']]});
  ex.sort((a,b)=>a.start-b.start);
  let end=0;
  for(const e of ex){ if(e.start<end) e.start=end+10; end=e.start+e.steps.reduce((s,x)=>s+x[1],0)*TURN; }
  return ex;
}

function mTick(){

      let st=M.ex.steps[M.step];

let coolUntil=0, paused=false, speed=1, acc=0, lastF=performance.now();
const TICK_MS=4450;
function act(fn, cost=1000){
  const now=performance.now();
  if(busy || now<coolUntil) return;
  if(paused) setPaused(false);
  fn(); coolUntil=now+cost/speed;
  if(S.ring && S.room==='flur') takeRing();
  meetCheck(); render();
  setTimeout(()=>{ if(!busy) render(); }, cost/speed+20);
  if(S.susp>=100 && !busy) gameOver();
}
function setPaused(v){ paused=v; $('pause').setAttribute('aria-pressed',v); $('pausetag').hidden=!v; document.querySelector('.app').classList.toggle('paused',v); }
function frame(now){
  const dt=Math.min(250, now-lastF); lastF=now;
  if(S && S.sched.length && !busy && !paused){
    acc+=dt*speed;
    if(acc>=TICK_MS){ acc=0; tick(); render(); if(S.susp>=100 && !busy) gameOver(); }
    $('tickbar').style.transform=`scaleX(${acc/TICK_MS})`;
  }
  const c=performance.now()<coolUntil; const a=$('acts'); if(a.classList.contains('cool')!==c) a.classList.toggle('cool',c);
  requestAnimationFrame(frame);
}

    sheet(`<h3>Tag ${S.day+1} geschafft</h3>

      [{label: last?'Zum Finale':'Schlafen bis morgen', go:true, fn:()=>{ if(S.susp>=100) return gameOver(); if(last) return finale(); modalQueue=[]; busy=false; startDay(S.day+1); }}]);

function startDay(d){
  if(MODE==='M') return startDayM(d);
  S.nightQ=false;
  S.coffees=0; S.events=0; S.used=[]; S.neighbor=0; S.pigeon=0; S.caughtDay=false; S.callDone=false; S.aperolDone=false; S.warned=null;
  acc=0; if(paused) setPaused(false);
  const prev=S.day;
  S.day=d; S.t=START; S.room='wohn'; S.dailyEx=[]; S.ring=null; S.disguise=null; S.lTV=null; S.deco=Math.max(S.deco||1,d+1);
  S.items={korb:'bad',pizza:'kueche'};
  S.M={room:'arbeit',ex:null,step:0,left:0,seen:false};
  S.sched=buildSchedule(d); S.deliv=DAYS[d].deliveries.map(x=>({...x})); S.total+=DAYS[d].deliveries.reduce((a,x)=>a+x.n,0)+(DAYS[d].flea?2:0);
  S.fleaDone=false;
  const morning=[];
  if(d>0){
    addSusp(-20);
    if(SPOTS.hafer && S.spots.hafer>0){ for(let i=S.spots.hafer;i>0;i--){ if(Math.random()<SPOTS.hafer.trig.muesli){ S.spots.hafer--; S.lost++; addSusp(20); morning.push(SPOTS.hafer.find);} } }
  }
  snap = JSON.stringify(S);
  S.log=[]; say(`09:00. L klappt im Wohnzimmer ihren Laptop auf und legt ihren Kritzelblock daneben. M arbeitet schon seit sechs.`);
  queue(()=>{
    sheet(`<h3>Tag ${d+1}</h3>${d>0?'<p>Über Nacht ist Ms Misstrauen etwas gesunken. Er hat drüber geschlafen.</p>':''}
      ${morning.map(m=>`<div class="say">Während L noch schlief: ${m} Er hat ihn behalten.</div>`).join('')}
      <p>${DAYS[d].intro}</p><div class="say"><b>M</b> beim Frühstück um acht: ${DAYS[d].m}</div>`,
      [{label:'Los geht’s',go:true,fn:done}]);

}

function render(){
  $('clock').childNodes[0].nodeValue = fmt(S.t);
  $('dayl').textContent = `Tag ${S.day+1} von ${DAYS.length}`;
  $('susbar').style.width = S.susp+'%';
  document.querySelector('.sus>span').textContent = MODE==='M' ? 'Ls Genervtheit' : 'Ms Misstrauen';
  const ms = !S.M.ex ? 'im Büro' : S.M.room==='weg' ? 'unterwegs' : S.M.ex.kind==='bed' ? (S.M.step>=2?'schläft':'geht schlafen') : ({flur:'im Flur',kueche:'in der Küche',wohn:'im Wohnzimmer',bad:'im Bad',schlaf:'im Schlafzimmer',arbeit:'im Büro'})[S.M.room];
  $('mstat').textContent = 'M ' + ms;
  if(MODE==='M'){ const nr=npcRoomM(); $('mstat').textContent = 'L ' + (npcAsleep()?'schläft':nr==='weg'?'unterwegs':({flur:'im Flur',kueche:'in der Küche',wohn:'im Wohnzimmer',bad:'im Bad',schlaf:'im Schlafzimmer',arbeit:'im Büro'})[nr]); }
  $('bag').innerHTML = MODE==='M' ? `<b>${S.fun}</b>Akku ${S.battery??100} %` : `<b>${GB}${S.inv}</b>${S.disguise?DISGUISE[S.disguise].n:'dabei'}`;
  $('dayl').textContent = `Tag ${S.day+1} von ${(MODE==='M'?DAYS_M:DAYS).length}`;

  const mOut = S.M.ex;
  updateHouse();

  $('log').innerHTML = S.log.slice(0,6).reverse().map(l=>`<p class="${l.cls}">${l.text}</p>`).join('');

  // Aktionen im aktuellen Raum
  if(MODE==='M'){ $('acts').innerHTML=actsM(); return; }
  const mHere = mOut && S.M.room===S.room;
  let h = `<h2><span>${ROOMS[S.room].n}${mHere?' · M ist hier!':''}</span><small>Tippen: verstecken · Halten: zurückholen</small></h2><div class="spots">`;
  const spots = Object.entries(SPOTS).filter(([,s])=>s.room===S.room);
  spots.forEach(([id,s])=>{
    const c=S.spots[id];
    const canIn=!(S.inv<=0||c>=s.cap||mHere||(id==='fiat'&&carGone()));
    h+=`<button class="spot${canIn?'':' no'}${c>0?' has':''}" id="spot-${id}" data-spot="${id}" aria-label="${s.n}: ${c} von ${s.cap}. Tippen zum Verstecken, halten zum Zurückholen"><span class="n">${s.n}</span><span class="c">${canIn?'<i>+</i>':''}${c}/${s.cap}</span><span class="d">${s.d}</span></button>`;
  });
  h+='</div><div class="row">';
  S.packages.forEach((p,i)=>{ if(p.room===S.room) h+=`<button class="btn go" id="pk-${i}" data-pk="${i}">Paket aufreißen (${p.n})</button>`; });
  Object.entries(DISGUISE).forEach(([k,dz])=>{
    if(S.items[k]===S.room && !S.disguise) h+=`<button class="btn" id="take-${k}" data-take="${k}">${dz.n} nehmen</button>`;
  });
  if(S.disguise) h+=`<button class="btn" id="drop" data-drop="1">${DISGUISE[S.disguise].n} abstellen</button>`;
  if(S.room==='wohn' && !mAsleep() && S.t>=540 && S.t<=1020 && !S.callDone) h+=`<button class="btn" id="lcall" data-call="1">Tratsch-Telefonat (30 Min.)</button>`;
  if(S.room==='kueche' && S.t>=900 && S.t<=1130 && !S.aperolDone) h+=`<button class="btn" id="laperol" data-aperol="1">Aperol-Pause (30 Min.)</button>`;
  if(S.room==='wohn' && mAsleep()){ h+=`<button class="btn" id="lt-aoe" data-lt="aoe">AoE zocken</button><button class="btn" id="lt-crime" data-lt="crime">True Crime schauen</button>`; }
  if(S.room==='flur' && DAYS[S.day].flea && !S.fleaDone && S.t<=1020) h+=`<button class="btn" id="flea" data-flea="1">Zum Flohmarkt (1 Std.)</button>`;
  h+=`</div>`;
  $('acts').innerHTML=h;
}

let longFired=false, lpT=null;
$('acts').addEventListener('pointerdown',e=>{
  const b=e.target.closest('.spot'); if(!b||busy) return; longFired=false; clearTimeout(lpT);
  lpT=setTimeout(()=>{ const id=b.dataset.spot; longFired=true;
    if(S.spots[id]<=0||(S.M.ex&&S.M.room===S.room)||(id==='fiat'&&carGone())) return;
    if(navigator.vibrate) navigator.vibrate(15); b.classList.add('long');
    act(()=>{ S.spots[id]--; S.inv++; say(`L holt einen Glowbie zurück (${SPOTS[id].n}).`); }); },480);
});

$('acts').addEventListener('click',e=>{

    if(mHere){ say('Nicht jetzt, M steht direkt daneben!','bad'); render(); return; }
    if(id==='fiat'&&carGone()){ say('Der Fiat ist gerade nicht da.'); render(); return; }
    if(c>=s.cap){ say(`${s.n} ist voll. Halten, um einen Glowbie zurückzuholen.`); render(); return; }
    if(S.inv<=0){ say(c>0?'L hat keinen Glowbie mehr dabei. Halten, um einen zurückzuholen.':'L hat keinen Glowbie dabei. Erst ein Paket aufreißen!'); render(); return; }
    D.in=id; }
  if(D.in) act(()=>{ S.spots[D.in]++; S.inv--; S.roomsUsed=[...new Set([...(S.roomsUsed||[]),SPOTS[D.in].room])]; if(S.roomsUsed.length>=6) ach('alle'); if(D.in==='hummer' && S.spots.hummer>=SPOTS.hummer.cap) ach('hummi'); if(Math.random()<.35) bubble('L',pick(['Psst!','Bleib da.','Gut so.','Keiner sieht dich.']),2000); say(`L versteckt einen Glowbie (${SPOTS[D.in].n}). ${pick(['Er sieht zufrieden aus.','Er hält ganz still.','Niemand wird ihn hier finden. Hoffentlich.'])}`); });
  else if(D.call) act(()=>{ S.callDone=true; ach('tratsch');
    const fr=Math.random()<.5, home=!(S.M.ex && S.M.room==='weg');
    bubble('L', fr?'Hiii! Du glaubst nicht…':'S! Hast du schon gehört…?',3200);
    say(fr?'L ruft ihre Freundin an und kritzelt dabei Herzchen-Hummer auf ihren Block.':'L hat einen Tratsch-Termin mit Kollege S. Auf ihrem Block entsteht ein Hummer mit Krawatte.');
    if(home && Math.random()<.3){ addSusp(10); bubble('M','Glow-was?!',3000); say('L sagt etwas zu laut „Glowbie“. Von nebenan: „Glow-was?!“ Ms Misstrauen steigt.','bad'); }
    else { addSusp(-6); const nx=S.sched.filter(x=>!x.used && x.start>S.t+30).sort((a,b)=>a.start-b.start)[0];

    passTime(3);
  }, 650);
  else if(D.aperol) act(()=>{ S.aperolDone=true; ach('aperol'); addSusp(-10);
    worldBubble('aperol',ox('kueche')+92,oy('kueche')+30,'Endlich!',2600); bubble('L','Saluti!',2600);
    say('L gönnt sich eine Aperol-Pause. Die Flasche ist zufrieden. L auch. Ms Misstrauen sinkt.','good');
    if(S.M.ex && S.M.room==='kueche'){ bubble('M','Krieg ich auch einen?',3000); }
    passTime(3);
  }, 650);
  else if(D.out) act(()=>{ S.spots[D.out]--; S.inv++; say(`L holt einen Glowbie zurück (${SPOTS[D.out].n}).`); });
  else if(D.pk!==undefined) act(()=>{ const p=S.packages.splice(+D.pk,1)[0]; S.inv+=p.n; S.received+=p.n; say(`L reißt das Paket auf: ${p.n} Glowbies. Der Karton fliegt ins Altpapier.`,'good'); });
  else if(D.take) act(()=>{ S.disguise=D.take; S.items[D.take]='L'; say(`L nimmt den ${DISGUISE[D.take].n}. Die perfekte Tarnung.`); });
  else if(D.drop) act(()=>{ S.items[S.disguise]=S.room; say(`L stellt den ${DISGUISE[S.disguise].n} ab.`); S.disguise=null; });
  else if(D.flea){
    if(S.disguise){ S.items[S.disguise]='flur'; S.disguise=null; }
    S.fleaDone=true; S.room='weg'; S.deco=Math.min(3,(S.deco||1)+1); say('L schleicht zur Wohnungstür hinaus. Ziel: Flohmarkt.');

    meetCheck(); render();
  }
});

function roleSheet(){
  sheet(`${LOGO}<p style="text-align:center">Wer spielt?</p>`,[
    {label:'L: Glowbies schmuggeln',go:true,fn:()=>{ MODE='L'; introL(); }},
    {label:'M: Zocken, Bier und Arminia',fn:()=>{ MODE='M'; S.t=START_M; S.room='schlaf'; FIGPOS.L=null; FIGPOS.M=null; introM(); }},
    {label:'Bestenliste ansehen',fn:()=>showBoard(roleSheet)},
    {label:'Erfolge ansehen',fn:()=>achSheet(roleSheet)},
    {label:'Feedback geben',fn:()=>feedbackSheet(roleSheet)}
  ]);
}
function introL(){
  sheet(`<h3>Hide and Seek with Glowbies</h3>${duo(GB+'<span>vs.</span>')}
    <p>L liebt Glowbies: kleine Figuren mit Antenne, die im Dunkeln glühen. M nennt sie liebevoll „grüner Plastikschrott“.</p>
    <p>L findet das nicht. Drei Tage lang muss sie neue Glowbies in die Wohnung schmuggeln und verstecken, ohne dass M etwas merkt.</p>
    <div class="say"><b class="lq">Über L:</b> Sie arbeitet ab neun im Wohnzimmer am Laptop, macht gern Pausen und kritzelt in jedem Meeting Hummer auf ihren Block. Beim Kochen läuft Metal.</div>
    <div class="say"><b>Über M:</b> Er steht um sechs auf, arbeitet im Arbeitszimmer, kommt nur für Kaffee, Klo und Essen raus und geht abends früh ins Bett. Dann gehört die Wohnung L. Manchmal verlässt er sogar die Wohnung, und manchmal kommt er plötzlich zurück, weil er etwas vergessen hat.</div>
    <p>Die Uhr läuft von selbst. Tippe auf benachbarte Räume, um zu gehen, und versteck Glowbies mit +. Pause und doppeltes Tempo findest du oben rechts. Manche Verstecke sind sicher, manche nur, bis M zufällig hineinschaut. Abends wird es dunkel, und dann leuchten schlecht versteckte Glowbies besonders auffällig. Wenn Ms Misstrauen 100 % erreicht, fliegt alles auf.</p>`,
    [{label:'Mission starten',go:true,fn:()=>{ nextModal(); startDay(0); }}]);
}
function introM(){
  sheet(`<h3>Anstoß um 18:30</h3>${duo(PAD+'<span>vs.</span>')}
    <p>M zockt gern EA FC, trinkt gern ein Bier und schaut jedes Spiel von Arminia Bielefeld. Hummi trägt dabei das Trikot. M steht um sechs auf und geht früh ins Bett, L ist abends länger wach.</p>
    <p>L findet, die PlayStation läuft zu oft. Und statt Bier hätte sie lieber einen Aperol mit ihm. Ins Outlet gehen beide gern zusammen, in der Stadt Kleidung shoppen ist Ls Sache.</p>
    <div class="say"><b>Dein Ziel:</b> Sammle Freizeitpunkte mit Zocken, Fußball, Bier und Golfübungen in der Wohnung, sei pünktlich in deinen Calls und beim Mittagessen, und behalte Ls Einkäufe und Glowbie-Pakete im Blick. Wird L zu genervt, zieht sie den Stecker.</div>
    <p>Fußball schauen ist erlaubt, L spielt dann nebenher am Handy. Beim Zocken solltest du schnell umschalten, wenn sie reinkommt.</p>`,
    [{label:'Anpfiff',go:true,fn:()=>{ nextModal(); startDay(0); }}]);
}
// ── Konfiguration (Level-Editor) ───────────────────────
const CUSTOM=[];
const ROOMTAG={schlaf:'bed',bad:'bath',kueche:'coffee',wohn:'sofa',flur:'leave',arbeit:'call'};
function customSVG(r){
  return CUSTOM.filter(c=>c.room===r).map(c=>{ const k=c.size||1, x=c.x, y=c.y;
    if(c.type==='hummer') return lob(x,y,2.6*k,'#e8453c');
    if(c.type==='glowbie') return `<g class="gbm" transform="translate(${x-6*k} ${y-14*k}) scale(${.5*k})">${GBP}</g>`;
    if(c.type==='pflanze') return `<g transform="translate(${x} ${y}) scale(${k})"><path d="M-5 0 h10 l-1.5 -8 h-7z" fill="#c9a24a"/><ellipse cx="-4" cy="-12" rx="4" ry="2.4" fill="#4f9a5a" transform="rotate(-30 -4 -12)"/><ellipse cx="4" cy="-13" rx="4" ry="2.4" fill="#5aa36a" transform="rotate(30 4 -13)"/><ellipse cx="0" cy="-16" rx="2.4" ry="4" fill="#4f9a5a"/></g>`;
    if(c.type==='bild') return `<g transform="translate(${x} ${y}) scale(${k})"><rect x="-8" y="-7" width="16" height="14" rx="1" fill="#c9a24a"/><rect x="-6.5" y="-5.5" width="13" height="11" fill="#cfe9f2"/>${lob(0,0,1.4,'#e8453c')}</g>`;
    if(c.type==='schild') return `<g transform="translate(${x} ${y}) scale(${k})"><rect x="${-(String(c.text||'').length*2.2+4)}" y="-5" width="${String(c.text||'').length*4.4+8}" height="9" rx="2" fill="#f3eefa" stroke="#8a6a4f" stroke-width=".8"/><text x="0" y="1.8" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="5.4" fill="#2a2235">${esc(c.text||'')}</text></g>`;
    return ''; }).join('');
}
const DEF=JSON.parse(JSON.stringify({SPOTS,SPOTPOS,EXCUSES,EXCUSES_M,OFFICE,MEET,MEET_L,PUSHES,DAYS,DAYS_M,CALLS}));
function restoreTo(obj,def){ const v=JSON.parse(JSON.stringify(def)); if(Array.isArray(obj)) obj.splice(0,obj.length,...v); else { Object.keys(obj).forEach(k=>delete obj[k]); Object.assign(obj,v); } }
function applyConfig(c){
  restoreTo(SPOTS,DEF.SPOTS); restoreTo(SPOTPOS,DEF.SPOTPOS); restoreTo(EXCUSES,DEF.EXCUSES); restoreTo(EXCUSES_M,DEF.EXCUSES_M);
  restoreTo(OFFICE,DEF.OFFICE); restoreTo(MEET,DEF.MEET); restoreTo(MEET_L,DEF.MEET_L); restoreTo(PUSHES,DEF.PUSHES);
  restoreTo(DAYS,DEF.DAYS); restoreTo(DAYS_M,DEF.DAYS_M); restoreTo(CALLS,DEF.CALLS); CUSTOM.splice(0);
  if(c){
    if(c.spots) for(const [id,v] of Object.entries(c.spots)){
      if(v.del){ delete SPOTS[id]; continue; }
      const base=SPOTS[id]||{trig:{}}; const sp={...base,room:v.room||base.room,n:v.n||base.n||'Versteck',d:v.d??base.d??'',cap:+v.cap||base.cap||1};
      if(v.risk!=null){ const t=base.trig||{}, tags=Object.keys(t);
        if(tags.length && sp.room===base.room){ const mx=Math.max(...Object.values(t))||1; sp.trig={}; tags.forEach(k=>sp.trig[k]=Math.min(1,t[k]/mx*v.risk)); }
        else sp.trig = v.risk>0 ? {[ROOMTAG[sp.room]]:v.risk} : {}; }
      if(v.find) sp.find=v.find; else if(!sp.find) sp.find=`M schaut genauer hin: ${sp.n}. Da leuchtet doch was!`;
      SPOTS[id]=sp; if(v.pos) SPOTPOS[id]=v.pos;
    }
    const L=(arr,val)=>{ if(Array.isArray(val)&&val.length) arr.splice(0,arr.length,...val); };
    L(OFFICE,c.office); L(MEET,c.meet); L(MEET_L,c.meetL); L(PUSHES,c.pushes); L(EXCUSES,c.excuses); L(EXCUSES_M,c.excusesM); L(CALLS,c.calls);
    (c.days||[]).forEach((d,i)=>{ if(DAYS[i]&&d) Object.assign(DAYS[i],d); });
    (c.daysM||[]).forEach((d,i)=>{ if(DAYS_M[i]&&d) Object.assign(DAYS_M[i],d); });
    if(Array.isArray(c.deco)) CUSTOM.push(...c.deco);
  }
  const pl=$('plan'); if(pl) pl.innerHTML='';
  Object.keys(FIGPOS).forEach(k=>delete FIGPOS[k]);
}
window.__glow={ DEF, SPOTS, SPOTPOS, EXCUSES, EXCUSES_M, OFFICE, MEET, MEET_L, PUSHES, DAYS, DAYS_M, CALLS, CUSTOM, ROOMS, ORDER, LABEL, ROOMTAG,
  ox, oy, roomSVG, SCX, SCY, SCS, applyConfig,
  get S(){ return S; },
  restart(){ busy=false; modalQueue=[]; $('modal').hidden=true; begin(); },
  halt(){ busy=true; modalQueue=[]; $('modal').hidden=true; } };
applyConfig(window.GLOWBIES_CFG||null);
begin();
})();
